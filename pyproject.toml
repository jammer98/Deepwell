[project]
name = "deepwell"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "jammer", email = "adityathakur00199.8@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.143.3",
    "httpx>=0.28.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
deepwell = "deepwell:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
